<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Incremental</title>
<style>
body
{
	background-color:#04011f;
	color:white;
	text-align:center
}
button
{
	width:200px;
	height:60px;
	background-color:#dcfede;
	color:black;
	border-radius:4px;
	border:none;
	transition: transform 0.25s ease;
}
button:hover
{
	transform:scale(1.2);
}
</style>
</head>
<body>
<h1>Sliding Incremental</h1>
<br>
<p>Ver 0.1.1-alpha </p>
<h2 id="your_point">Point:_</h2>
<p id="speed">v=_ point/s</p>
<button id="click_here" onclick="spd++;">SPEED UP!</button>
<script>
	let pK=100;
	let spd=0;
	let Point=0;
	let ptscr=document.getElementById("your_point");
	let spdscr=document.getElementById("speed");
	function update()
	{
		spd*=(1-1/pK);
		Point+=spd/60;
		ptscr.innerHTML="Point:<span style=\"color:#dcfede\">"+Point.toFixed(2)+"</span>";
		spdscr.innerHTML="v=<span style=\"color:#fedcde\">"+spd.toFixed(2);+"point/s";
	}
	setInterval(update,50/3)
</script>
</body>
</html>
